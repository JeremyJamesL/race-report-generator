<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strava Race Report Generator - Jezl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="relative">
    <div class="app">
      <header class="bg-black/50 text-white py-3">
        <div class="container text-center">
          <h1 class="text-lg uppercase font-light">
            <span class="mr-2 text-2xl">👟</span>

            <a href="/"
              ><span class="font-bold">Strava</span> race report generator</a
            >
          </h1>
        </div>
      </header>

      <main class="py-10">
        <div class="container">
          <!-- Submission modal -->
          <div
            id="modal"
            class="hidden w-full h-full bg-black/50 top-0 left-0 justify-center items-center px-3"
          >
            <div
              class="inner relative bg-white border-4 border-orange-600 rounded-lg py-5 px-7"
            >
              <div
                id="close-modal"
                class="absolute top-1 right-2 rounded-full font-black inline-block leading-none"
              >
                x
              </div>
              <div class="modal-content">
                <h1 class="text-black font-medium text-lg mb-3">
                  Add your race id:
                </h1>
                <div class="flex items-end">
                  <span class="mr-2 text-neutral-500"
                    >strava.com/activities/
                  </span>
                  <input
                    class="bg-neutral-100 border-black border rounded-lg p-1"
                    type="text"
                    id="race-input"
                  />
                  <br />
                </div>
                <button class="block" id="submit-race">Submit</button>
                <div id="form-feedback"></div>
              </div>
            </div>
          </div>

          <!-- Error modal -->
          <div
            id="error-modal"
            class="hidden w-full h-full bg-black/50 top-0 left-0 justify-center items-center px-3"
          >
            <div
              class="inner relative bg-white border-4 border-orange-600 rounded-lg py-5 px-7"
            >
              <div
                id="close-error-modal"
                class="absolute top-1 right-2 rounded-full font-black inline-block leading-none"
              >
                x
              </div>
              <div class="modal-content">
                Please add sufficient permisssions!
              </div>
            </div>
          </div>
          <div id="primary-content">
            <div class="home-action text-center flex justify-center flex-col">
              <button
                id="add-race"
                class="btn text-sm mb-3 bg-neutral-100 py-2 px-3 text-neutral-800 uppercase font-medium self-center"
              >
                <span class="text-orange-500"></span>Add strava race</button
              ><button
                class="btn text-sm mb-3 bg-neutral-100 py-2 px-3 text-neutral-800 uppercase font-medium self-center"
              >
                <span class="text-orange-500"></span>Enter manually</button
              ><button
                class="btn text-sm mb-3 bg-neutral-100 py-2 px-3 text-neutral-800 uppercase font-medium self-center"
              >
                <span class="text-orange-500"></span>Help
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="./dist/bundle.js"></script>
  </body>
</html>
